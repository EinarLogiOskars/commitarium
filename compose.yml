name: commitarium

services:
  coordinator:
    build:
      context: .
      dockerfile: docker/coordinator.Dockerfile
    environment:
      COMMITARIUM_DATABASE_PATH: /var/lib/commitarium/coordinator.db
      COMMITARIUM_RUNNER_MODE: ${COMMITARIUM_RUNNER_MODE:-simulated}
      COMMITARIUM_SIMULATED_STEP_DELAY: ${COMMITARIUM_SIMULATED_STEP_DELAY:-250ms}
      COMMITARIUM_FORGEJO_URL: http://forgejo:3000
      COMMITARIUM_FORGEJO_OWNER: ${COMMITARIUM_FORGEJO_OWNER:-commitarium_admin}
      COMMITARIUM_FORGEJO_HOST_URL: http://127.0.0.1:${COMMITARIUM_FORGEJO_PORT:-3001}
      COMMITARIUM_FORGEJO_TOKEN_FILE: /run/commitarium-config/forgejo-token
      COMMITARIUM_FORGEJO_VIEWER_LOGIN: ${COMMITARIUM_FORGEJO_VIEWER_LOGIN:-commitarium-viewer}
      COMMITARIUM_WORKSPACE_ROOT: /workspaces
      COMMITARIUM_REVIEWER_WORKSPACE_ROOT: /reviewer-workspaces
      COMMITARIUM_TOOLCHAIN_ROOT: /var/lib/commitarium-toolchains
      # Agent workers are addressed by convention (ADR-016): service
      # agent-<id>-worker, bearer token agent-<id>-worker-token in this directory.
      COMMITARIUM_AGENT_WORKER_TOKEN_DIR: /run/commitarium-agent-workers
    volumes:
      - coordinator-data:/var/lib/commitarium
      - ${COMMITARIUM_FORGEJO_TOKEN_SOURCE:-./.commitarium/forgejo-token}:/run/commitarium-config/forgejo-token:ro
      - ${COMMITARIUM_AGENT_WORKER_TOKEN_DIR_SOURCE:-./.commitarium/internal/agent-workers}:/run/commitarium-agent-workers:ro
      - ${COMMITARIUM_WORKSPACE_SOURCE:-./.commitarium/workspaces}:/workspaces
      - ${COMMITARIUM_REVIEWER_WORKSPACE_SOURCE:-./.commitarium/reviewer-workspaces}:/reviewer-workspaces
      - commitarium-toolchains:/var/lib/commitarium-toolchains
    ports:
      - "127.0.0.1:${COMMITARIUM_COORDINATOR_PORT:-8080}:8080"

  simulated-codex-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      COMMITARIUM_WORKER_DATABASE_PATH: /var/lib/commitarium-worker/worker.db
      COMMITARIUM_WORKER_LISTEN_ADDRESS: :8081
      COMMITARIUM_WORKER_STEP_DELAY: ${COMMITARIUM_WORKER_STEP_DELAY:-250ms}
      COMMITARIUM_WORKER_TOKEN_FILE: /run/commitarium-internal/worker-token
    volumes:
      - simulated-codex-worker-journal:/var/lib/commitarium-worker
      - ${COMMITARIUM_SIMULATED_WORKER_TOKEN_SOURCE:-./.commitarium/internal/simulated-worker-token}:/run/commitarium-internal/worker-token:ro
    expose:
      - "8081"

  # Provider templates for agent workers (ADR-016). They are never started:
  # the desktop generates one agent-<id>-worker service per agent from the
  # resolved template, adding the agent's profile, journal, tokens, and both
  # workspace trees.
  codex-agent-template:
    profiles: ["agent-template"]
    image: commitarium-codex-agent-worker
    build:
      context: .
      dockerfile: docker/codex-worker.Dockerfile
      args:
        CODEX_VERSION: ${COMMITARIUM_CODEX_VERSION:-0.153.4}
    environment:
      COMMITARIUM_WORKER_ADAPTER: codex
      COMMITARIUM_CODEX_MODEL: ${COMMITARIUM_CODEX_MODEL:-}
      COMMITARIUM_CODEX_AVAILABLE_MODELS: ${COMMITARIUM_CODEX_AVAILABLE_MODELS:-}
      # Docker remains the boundary for write-capable turns. Read-only turns
      # additionally use Codex's bwrap sandbox, enabled below without granting
      # SYS_ADMIN, privileged mode, or access to the Docker socket.
      COMMITARIUM_CODEX_SANDBOX: danger-full-access
    security_opt:
      - seccomp=unconfined
    expose:
      - "8081"

  claude-agent-template:
    profiles: ["agent-template"]
    image: commitarium-claude-agent-worker
    build:
      context: .
      dockerfile: docker/claude-worker.Dockerfile
      args:
        CLAUDE_CODE_VERSION: ${COMMITARIUM_CLAUDE_CODE_VERSION:-2.1.270}
    environment:
      COMMITARIUM_WORKER_ADAPTER: claude_code
      COMMITARIUM_CLAUDE_MODEL: ${COMMITARIUM_CLAUDE_MODEL:-}
      COMMITARIUM_CLAUDE_AVAILABLE_MODELS: ${COMMITARIUM_CLAUDE_AVAILABLE_MODELS:-claude-fable-5-1,claude-opus-5,claude-opus-4-8,claude-sonnet-5,claude-haiku-4-5-20251001}
      # Claude's permission prompts cannot be answered in a headless worker.
      # The unprivileged container, scoped mounts, and internal forge are the
      # security boundary for this profile.
      COMMITARIUM_CLAUDE_PERMISSION_MODE: bypassPermissions
    expose:
      - "8081"

  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.3-rootless
    user: "1000:1000"
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__ROOT_URL: http://localhost:3001/
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
    volumes:
      - forgejo-data:/var/lib/gitea
    ports:
      - "127.0.0.1:${COMMITARIUM_FORGEJO_PORT:-3001}:3000"

volumes:
  coordinator-data:
  forgejo-data:
  simulated-codex-worker-journal:
  # The codex and claude agents keep the volumes of the lead profiles they
  # were migrated from (ADR-016); reviewer profile volumes are kept unused.
  codex-worker-journal:
  codex-profile:
  codex-reviewer-worker-journal:
  codex-reviewer-profile:
  claude-worker-journal:
  claude-profile:
  claude-reviewer-worker-journal:
  claude-reviewer-profile:
  commitarium-toolchains:
