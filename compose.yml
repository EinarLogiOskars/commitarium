name: commitarium

services:
  coordinator:
    build:
      context: .
      dockerfile: docker/coordinator.Dockerfile
    environment:
      COMMITARIUM_DATABASE_PATH: /var/lib/commitarium/coordinator.db
      COMMITARIUM_RUNNER_MODE: ${COMMITARIUM_RUNNER_MODE:-simulated}
      COMMITARIUM_SIMULATED_STEP_DELAY: ${COMMITARIUM_SIMULATED_STEP_DELAY:-250ms}
      COMMITARIUM_FORGEJO_URL: http://forgejo:3000
      COMMITARIUM_FORGEJO_OWNER: ${COMMITARIUM_FORGEJO_OWNER:-commitarium_admin}
      COMMITARIUM_FORGEJO_HOST_URL: http://127.0.0.1:${COMMITARIUM_FORGEJO_PORT:-3001}
      COMMITARIUM_FORGEJO_TOKEN_FILE: /run/commitarium-config/forgejo-token
      COMMITARIUM_WORKSPACE_ROOT: /workspaces
      COMMITARIUM_CODEX_WORKER_URL: http://codex-worker:8081
      COMMITARIUM_CODEX_WORKER_TOKEN_FILE: /run/commitarium-internal/codex-lead-worker-token
      COMMITARIUM_CODEX_PROFILE_ID: ${COMMITARIUM_CODEX_PROFILE_ID:-profile_local_codex}
      COMMITARIUM_CODEX_REVIEWER_WORKER_URL: http://codex-reviewer-worker:8081
      COMMITARIUM_CODEX_REVIEWER_WORKER_TOKEN_FILE: /run/commitarium-internal/codex-reviewer-worker-token
      COMMITARIUM_CODEX_REVIEWER_PROFILE_ID: ${COMMITARIUM_CODEX_REVIEWER_PROFILE_ID:-profile_local_codex_reviewer}
      COMMITARIUM_CODEX_FORGEJO_LOGIN: ${COMMITARIUM_CODEX_FORGEJO_LOGIN:-codex-lead}
      COMMITARIUM_CODEX_REVIEWER_FORGEJO_LOGIN: ${COMMITARIUM_CODEX_REVIEWER_FORGEJO_LOGIN:-codex-reviewer}
      COMMITARIUM_CLAUDE_WORKER_URL: http://claude-worker:8081
      COMMITARIUM_CLAUDE_WORKER_TOKEN_FILE: /run/commitarium-internal/claude-lead-worker-token
      COMMITARIUM_CLAUDE_PROFILE_ID: ${COMMITARIUM_CLAUDE_PROFILE_ID:-profile_local_claude}
      COMMITARIUM_CLAUDE_REVIEWER_WORKER_URL: http://claude-reviewer-worker:8081
      COMMITARIUM_CLAUDE_REVIEWER_WORKER_TOKEN_FILE: /run/commitarium-internal/claude-reviewer-worker-token
      COMMITARIUM_CLAUDE_REVIEWER_PROFILE_ID: ${COMMITARIUM_CLAUDE_REVIEWER_PROFILE_ID:-profile_local_claude_reviewer}
      COMMITARIUM_CLAUDE_FORGEJO_LOGIN: ${COMMITARIUM_CLAUDE_FORGEJO_LOGIN:-claude-lead}
      COMMITARIUM_CLAUDE_REVIEWER_FORGEJO_LOGIN: ${COMMITARIUM_CLAUDE_REVIEWER_FORGEJO_LOGIN:-claude-reviewer}
    volumes:
      - coordinator-data:/var/lib/commitarium
      - ${COMMITARIUM_FORGEJO_TOKEN_SOURCE:-./.commitarium/forgejo-token}:/run/commitarium-config/forgejo-token:ro
      - ${COMMITARIUM_CODEX_WORKER_TOKEN_SOURCE:-./.commitarium/internal/codex-lead-worker-token}:/run/commitarium-internal/codex-lead-worker-token:ro
      - ${COMMITARIUM_CODEX_REVIEWER_WORKER_TOKEN_SOURCE:-./.commitarium/internal/codex-reviewer-worker-token}:/run/commitarium-internal/codex-reviewer-worker-token:ro
      - ${COMMITARIUM_CLAUDE_WORKER_TOKEN_SOURCE:-./.commitarium/internal/claude-lead-worker-token}:/run/commitarium-internal/claude-lead-worker-token:ro
      - ${COMMITARIUM_CLAUDE_REVIEWER_WORKER_TOKEN_SOURCE:-./.commitarium/internal/claude-reviewer-worker-token}:/run/commitarium-internal/claude-reviewer-worker-token:ro
      - ${COMMITARIUM_WORKSPACE_SOURCE:-./.commitarium/workspaces}:/workspaces
    ports:
      - "127.0.0.1:${COMMITARIUM_COORDINATOR_PORT:-8080}:8080"

  simulated-codex-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      COMMITARIUM_WORKER_DATABASE_PATH: /var/lib/commitarium-worker/worker.db
      COMMITARIUM_WORKER_LISTEN_ADDRESS: :8081
      COMMITARIUM_WORKER_STEP_DELAY: ${COMMITARIUM_WORKER_STEP_DELAY:-250ms}
      COMMITARIUM_WORKER_TOKEN_FILE: /run/commitarium-internal/worker-token
    volumes:
      - simulated-codex-worker-journal:/var/lib/commitarium-worker
      - ${COMMITARIUM_SIMULATED_WORKER_TOKEN_SOURCE:-./.commitarium/internal/simulated-worker-token}:/run/commitarium-internal/worker-token:ro
    expose:
      - "8081"

  codex-worker:
    profiles: ["real-codex"]
    build:
      context: .
      dockerfile: docker/codex-worker.Dockerfile
      args:
        CODEX_VERSION: ${COMMITARIUM_CODEX_VERSION:-0.153.4}
    environment:
      COMMITARIUM_WORKER_ADAPTER: codex
      COMMITARIUM_WORKER_DATABASE_PATH: /var/lib/commitarium-worker/worker.db
      COMMITARIUM_WORKER_LISTEN_ADDRESS: :8081
      COMMITARIUM_WORKER_TOKEN_FILE: /run/commitarium-internal/worker-token
      COMMITARIUM_CODEX_PROVIDER_STATE_PATH: /var/lib/commitarium-provider
      COMMITARIUM_CODEX_WORKSPACE_ROOT: /workspaces
      COMMITARIUM_CODEX_PROFILE_ID: ${COMMITARIUM_CODEX_PROFILE_ID:-profile_local_codex}
      COMMITARIUM_CODEX_MODEL: ${COMMITARIUM_CODEX_MODEL:-}
      COMMITARIUM_CODEX_FORGEJO_URL: http://forgejo:3000
      COMMITARIUM_CODEX_FORGEJO_TOKEN_FILE: /run/commitarium-agent/forgejo-token
      COMMITARIUM_CODEX_FORGEJO_LOGIN: ${COMMITARIUM_CODEX_FORGEJO_LOGIN:-codex-lead}
      COMMITARIUM_CODEX_FORGEJO_ROLE: lead
      COMMITARIUM_CODEX_GIT_AUTHOR_NAME: ${COMMITARIUM_CODEX_GIT_AUTHOR_NAME:-Commitarium Codex Lead}
      COMMITARIUM_CODEX_GIT_AUTHOR_EMAIL: ${COMMITARIUM_CODEX_GIT_AUTHOR_EMAIL:-codex-lead@commitarium.local}
      # Docker is the security boundary. Codex's nested Linux sandbox cannot
      # create namespaces inside this unprivileged container.
      COMMITARIUM_CODEX_SANDBOX: danger-full-access
    volumes:
      - codex-worker-journal:/var/lib/commitarium-worker
      - codex-profile:/var/lib/commitarium-provider
      - ${COMMITARIUM_CODEX_WORKER_TOKEN_SOURCE:-./.commitarium/internal/codex-lead-worker-token}:/run/commitarium-internal/worker-token:ro
      - ${COMMITARIUM_CODEX_FORGEJO_TOKEN_SOURCE:-./.commitarium/agents/codex-lead/forgejo-token}:/run/commitarium-agent/forgejo-token:ro
      - ${COMMITARIUM_WORKSPACE_SOURCE:-./.commitarium/workspaces}:/workspaces
      - ${COMMITARIUM_CODEX_WORKSPACE_SOURCE:-.}:/workspaces/${COMMITARIUM_CODEX_WORKSPACE_ID:-workspace_smoke}:ro
    expose:
      - "8081"

  codex-reviewer-worker:
    profiles: ["real-codex"]
    build:
      context: .
      dockerfile: docker/codex-worker.Dockerfile
      args:
        CODEX_VERSION: ${COMMITARIUM_CODEX_VERSION:-0.153.4}
    environment:
      COMMITARIUM_WORKER_ADAPTER: codex
      COMMITARIUM_WORKER_DATABASE_PATH: /var/lib/commitarium-worker/worker.db
      COMMITARIUM_WORKER_LISTEN_ADDRESS: :8081
      COMMITARIUM_WORKER_TOKEN_FILE: /run/commitarium-internal/worker-token
      COMMITARIUM_CODEX_PROVIDER_STATE_PATH: /var/lib/commitarium-provider
      COMMITARIUM_CODEX_WORKSPACE_ROOT: /workspaces
      COMMITARIUM_CODEX_PROFILE_ID: ${COMMITARIUM_CODEX_REVIEWER_PROFILE_ID:-profile_local_codex_reviewer}
      COMMITARIUM_CODEX_MODEL: ${COMMITARIUM_CODEX_REVIEWER_MODEL:-}
      COMMITARIUM_CODEX_FORGEJO_URL: http://forgejo:3000
      COMMITARIUM_CODEX_FORGEJO_TOKEN_FILE: /run/commitarium-agent/forgejo-token
      COMMITARIUM_CODEX_FORGEJO_LOGIN: ${COMMITARIUM_CODEX_REVIEWER_FORGEJO_LOGIN:-codex-reviewer}
      COMMITARIUM_CODEX_FORGEJO_ROLE: reviewer
      COMMITARIUM_CODEX_GIT_AUTHOR_NAME: ${COMMITARIUM_CODEX_REVIEWER_GIT_AUTHOR_NAME:-Commitarium Codex Reviewer}
      COMMITARIUM_CODEX_GIT_AUTHOR_EMAIL: ${COMMITARIUM_CODEX_REVIEWER_GIT_AUTHOR_EMAIL:-codex-reviewer@commitarium.local}
      # Docker and the internal Forgejo repository are the security boundary.
      # Ordinary review-turn instructions still forbid Git writes.
      COMMITARIUM_CODEX_SANDBOX: danger-full-access
    volumes:
      - codex-reviewer-worker-journal:/var/lib/commitarium-worker
      - codex-reviewer-profile:/var/lib/commitarium-provider
      - ${COMMITARIUM_CODEX_REVIEWER_WORKER_TOKEN_SOURCE:-./.commitarium/internal/codex-reviewer-worker-token}:/run/commitarium-internal/worker-token:ro
      - ${COMMITARIUM_CODEX_REVIEWER_FORGEJO_TOKEN_SOURCE:-./.commitarium/agents/codex-reviewer/forgejo-token}:/run/commitarium-agent/forgejo-token:ro
      - ${COMMITARIUM_WORKSPACE_SOURCE:-./.commitarium/workspaces}:/workspaces
      - ${COMMITARIUM_CODEX_WORKSPACE_SOURCE:-.}:/workspaces/${COMMITARIUM_CODEX_WORKSPACE_ID:-workspace_smoke}:ro
    expose:
      - "8081"

  claude-worker:
    profiles: ["real-claude"]
    build:
      context: .
      dockerfile: docker/claude-worker.Dockerfile
      args:
        CLAUDE_CODE_VERSION: ${COMMITARIUM_CLAUDE_CODE_VERSION:-2.1.228}
    environment:
      COMMITARIUM_WORKER_ADAPTER: claude_code
      COMMITARIUM_WORKER_DATABASE_PATH: /var/lib/commitarium-worker/worker.db
      COMMITARIUM_WORKER_LISTEN_ADDRESS: :8081
      COMMITARIUM_WORKER_TOKEN_FILE: /run/commitarium-internal/worker-token
      COMMITARIUM_CLAUDE_PROVIDER_STATE_PATH: /var/lib/commitarium-provider
      COMMITARIUM_CLAUDE_WORKSPACE_ROOT: /workspaces
      COMMITARIUM_CLAUDE_PROFILE_ID: ${COMMITARIUM_CLAUDE_PROFILE_ID:-profile_local_claude}
      COMMITARIUM_CLAUDE_MODEL: ${COMMITARIUM_CLAUDE_MODEL:-}
      COMMITARIUM_CLAUDE_FORGEJO_URL: http://forgejo:3000
      COMMITARIUM_CLAUDE_FORGEJO_TOKEN_FILE: /run/commitarium-agent/forgejo-token
      COMMITARIUM_CLAUDE_FORGEJO_LOGIN: ${COMMITARIUM_CLAUDE_FORGEJO_LOGIN:-claude-lead}
      COMMITARIUM_CLAUDE_FORGEJO_ROLE: lead
      COMMITARIUM_CLAUDE_GIT_AUTHOR_NAME: ${COMMITARIUM_CLAUDE_GIT_AUTHOR_NAME:-Commitarium Claude Lead}
      COMMITARIUM_CLAUDE_GIT_AUTHOR_EMAIL: ${COMMITARIUM_CLAUDE_GIT_AUTHOR_EMAIL:-claude-lead@commitarium.local}
      # Claude's permission prompts cannot be answered in a headless worker.
      # The unprivileged container, scoped mounts, and internal forge are the
      # security boundary for this profile.
      COMMITARIUM_CLAUDE_PERMISSION_MODE: bypassPermissions
    volumes:
      - claude-worker-journal:/var/lib/commitarium-worker
      - claude-profile:/var/lib/commitarium-provider
      - ${COMMITARIUM_CLAUDE_WORKER_TOKEN_SOURCE:-./.commitarium/internal/claude-lead-worker-token}:/run/commitarium-internal/worker-token:ro
      - ${COMMITARIUM_CLAUDE_FORGEJO_TOKEN_SOURCE:-./.commitarium/agents/claude-lead/forgejo-token}:/run/commitarium-agent/forgejo-token:ro
      - ${COMMITARIUM_WORKSPACE_SOURCE:-./.commitarium/workspaces}:/workspaces
      - ${COMMITARIUM_CLAUDE_WORKSPACE_SOURCE:-.}:/workspaces/${COMMITARIUM_CLAUDE_WORKSPACE_ID:-workspace_smoke}:ro
    expose:
      - "8081"

  claude-reviewer-worker:
    profiles: ["real-claude"]
    build:
      context: .
      dockerfile: docker/claude-worker.Dockerfile
      args:
        CLAUDE_CODE_VERSION: ${COMMITARIUM_CLAUDE_CODE_VERSION:-2.1.228}
    environment:
      COMMITARIUM_WORKER_ADAPTER: claude_code
      COMMITARIUM_WORKER_DATABASE_PATH: /var/lib/commitarium-worker/worker.db
      COMMITARIUM_WORKER_LISTEN_ADDRESS: :8081
      COMMITARIUM_WORKER_TOKEN_FILE: /run/commitarium-internal/worker-token
      COMMITARIUM_CLAUDE_PROVIDER_STATE_PATH: /var/lib/commitarium-provider
      COMMITARIUM_CLAUDE_WORKSPACE_ROOT: /workspaces
      COMMITARIUM_CLAUDE_PROFILE_ID: ${COMMITARIUM_CLAUDE_REVIEWER_PROFILE_ID:-profile_local_claude_reviewer}
      COMMITARIUM_CLAUDE_MODEL: ${COMMITARIUM_CLAUDE_REVIEWER_MODEL:-}
      COMMITARIUM_CLAUDE_FORGEJO_URL: http://forgejo:3000
      COMMITARIUM_CLAUDE_FORGEJO_TOKEN_FILE: /run/commitarium-agent/forgejo-token
      COMMITARIUM_CLAUDE_FORGEJO_LOGIN: ${COMMITARIUM_CLAUDE_REVIEWER_FORGEJO_LOGIN:-claude-reviewer}
      COMMITARIUM_CLAUDE_FORGEJO_ROLE: reviewer
      COMMITARIUM_CLAUDE_GIT_AUTHOR_NAME: ${COMMITARIUM_CLAUDE_REVIEWER_GIT_AUTHOR_NAME:-Commitarium Claude Reviewer}
      COMMITARIUM_CLAUDE_GIT_AUTHOR_EMAIL: ${COMMITARIUM_CLAUDE_REVIEWER_GIT_AUTHOR_EMAIL:-claude-reviewer@commitarium.local}
      COMMITARIUM_CLAUDE_PERMISSION_MODE: bypassPermissions
    volumes:
      - claude-reviewer-worker-journal:/var/lib/commitarium-worker
      - claude-reviewer-profile:/var/lib/commitarium-provider
      - ${COMMITARIUM_CLAUDE_REVIEWER_WORKER_TOKEN_SOURCE:-./.commitarium/internal/claude-reviewer-worker-token}:/run/commitarium-internal/worker-token:ro
      - ${COMMITARIUM_CLAUDE_REVIEWER_FORGEJO_TOKEN_SOURCE:-./.commitarium/agents/claude-reviewer/forgejo-token}:/run/commitarium-agent/forgejo-token:ro
      - ${COMMITARIUM_WORKSPACE_SOURCE:-./.commitarium/workspaces}:/workspaces
      - ${COMMITARIUM_CLAUDE_WORKSPACE_SOURCE:-.}:/workspaces/${COMMITARIUM_CLAUDE_WORKSPACE_ID:-workspace_smoke}:ro
    expose:
      - "8081"

  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.3-rootless
    user: "1000:1000"
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__ROOT_URL: http://localhost:3001/
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
    volumes:
      - forgejo-data:/var/lib/gitea
    ports:
      - "127.0.0.1:${COMMITARIUM_FORGEJO_PORT:-3001}:3000"

volumes:
  coordinator-data:
  forgejo-data:
  simulated-codex-worker-journal:
  codex-worker-journal:
  codex-profile:
  codex-reviewer-worker-journal:
  codex-reviewer-profile:
  claude-worker-journal:
  claude-profile:
  claude-reviewer-worker-journal:
  claude-reviewer-profile:
