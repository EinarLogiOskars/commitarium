# A standalone single-role Codex worker for the manual smoke test, built from
# the Codex agent worker template. The desktop runs agent workers instead.
services:
  codex-worker:
    extends:
      file: compose.yml
      service: codex-agent-template
    profiles: !reset []
    environment:
      COMMITARIUM_WORKER_DATABASE_PATH: /var/lib/commitarium-worker/worker.db
      COMMITARIUM_WORKER_LISTEN_ADDRESS: :8081
      COMMITARIUM_WORKER_TOKEN_FILE: /run/commitarium-internal/worker-token
      COMMITARIUM_CODEX_PROVIDER_STATE_PATH: /var/lib/commitarium-provider
      COMMITARIUM_CODEX_WORKSPACE_ROOT: /workspaces
      COMMITARIUM_TOOLCHAIN_ROOT: /var/lib/commitarium-toolchains
      COMMITARIUM_CODEX_PROFILE_ID: ${COMMITARIUM_CODEX_PROFILE_ID:-codex}
      COMMITARIUM_CODEX_FORGEJO_URL: http://forgejo:3000
      COMMITARIUM_CODEX_FORGEJO_TOKEN_FILE: /run/commitarium-agent/forgejo-token
      COMMITARIUM_CODEX_FORGEJO_LOGIN: codex-lead
      COMMITARIUM_CODEX_FORGEJO_ROLE: lead
      COMMITARIUM_CODEX_GIT_AUTHOR_NAME: Commitarium Codex Lead
      COMMITARIUM_CODEX_GIT_AUTHOR_EMAIL: codex-lead@commitarium.local
    volumes:
      - codex-worker-journal:/var/lib/commitarium-worker
      - codex-profile:/var/lib/commitarium-provider
      - ${COMMITARIUM_CODEX_WORKER_TOKEN_SOURCE:-./.commitarium/internal/agent-workers/agent-codex-worker-token}:/run/commitarium-internal/worker-token:ro
      - ./.commitarium/agents/codex-lead/forgejo-token:/run/commitarium-agent/forgejo-token:ro
      - ${COMMITARIUM_CODEX_WORKSPACE_SOURCE:-.}:/workspaces/${COMMITARIUM_CODEX_WORKSPACE_ID:-workspace_smoke}:ro
      - commitarium-toolchains:/var/lib/commitarium-toolchains
    ports:
      - "127.0.0.1:${COMMITARIUM_CODEX_WORKER_PORT}:8081"
