# Which of Commitarium's own commands each kind of window may invoke.

[[set]]
identifier = "main-window"
description = "Every command: the main window is Commitarium's trusted UI, loaded from the app itself."
permissions = [
  "allow-open-app-window",
  "allow-webview-snapshot",
  "allow-webview-snapshot-supported",
  "allow-agent-cli-status",
  "allow-coordinator-freshness",
  "allow-rebuild-coordinator",
  "allow-prune-session-previews",
  "allow-docker-probe",
  "allow-launch-docker-desktop",
  "allow-stack-up",
  "allow-stack-down",
  "allow-stack-update",
  "allow-stack-status",
  "allow-get-forgejo-viewer-status",
  "allow-configure-forgejo-viewer",
  "allow-provision-environment-request",
  "allow-run-validation-job",
  "allow-load-desktop-settings",
  "allow-save-desktop-settings",
  "allow-confirm-exit",
  "allow-cancel-exit",
  "allow-notify-attention",
  "allow-disk-space-probe",
  "allow-create-backup",
  "allow-inspect-backup",
  "allow-restore-backup",
  "allow-check-desktop-update",
  "allow-install-desktop-update",
  "allow-restart-app",
  "allow-prepare-local-changes",
  "allow-record-local-changes-brought-in",
  "allow-load-ui-state",
  "allow-save-ui-state",
  "allow-inspect-folder",
  "allow-import-project",
  "allow-get-project-source",
  "allow-delete-project",
  "allow-probe-git-providers",
  "allow-create-project-remote",
  "allow-synchronize-feature-locally",
  "allow-synchronize-feature-to-folder",
  "allow-get-project-sync-state",
  "allow-get-git-identity",
  "allow-initialize-project-local-repository",
  "allow-synchronize-project-locally",
  "allow-preview-project-upstream-branch",
  "allow-publish-project-upstream-branch",
  "allow-preview-upstream-branch",
  "allow-publish-upstream-branch",
  "allow-start-preview",
  "allow-stop-preview",
  "allow-reset-preview-data",
  "allow-get-preview-status",
  "allow-get-preview-logs",
  "allow-run-preview-check",
  "allow-list-profiles",
  "allow-begin-login",
  "allow-submit-login-code",
  "allow-submit-api-key",
  "allow-cancel-login",
  "allow-verify-profile",
  "allow-disconnect-profile",
]

[[set]]
identifier = "app-page"
description = "What an app's window needs and no more: its preview, the assistant's agent sign-in, a snapshot of itself to show the assistant, and bringing the stack up. Its page is served from 127.0.0.1 so the app it frames is same-site (ADR-029)."
permissions = [
  "allow-get-preview-status",
  "allow-start-preview",
  "allow-stop-preview",
  "allow-reset-preview-data",
  "allow-open-app-window",
  "allow-webview-snapshot",
  "allow-webview-snapshot-supported",
  "allow-agent-cli-status",
  "allow-list-profiles",
  "allow-begin-login",
  "allow-submit-login-code",
  "allow-submit-api-key",
  "allow-cancel-login",
  "allow-disconnect-profile",
  "allow-stack-up",
]
