[package]
name = "commitarium-host"
version = "0.9.3"
description = "Commitarium's trusted host, beside the Docker stack (ADR-040)"
authors = ["Einar Logi Óskarsson"]
edition = "2021"

[lib]
name = "commitarium_host"

[[bin]]
name = "commitarium-host"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "sync", "time"] }
zeroize = "1"
