[package]
name = "commitarium-host"
version = "0.12.0-rc.1"
description = "Commitarium's trusted host, beside the Docker stack (ADR-040)"
authors = ["Einar Logi Óskarsson"]
edition = "2021"

[lib]
name = "commitarium_host"

[[bin]]
name = "commitarium-host"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bcrypt = "0.17"
fs2 = "0.4"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.3"
hmac = "0.12"
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1", "server-auto"] }
minisign-verify = { version = "0.3.0", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
spake2 = "0.4.0"
tempfile = "3"
tiny_http = "0.12"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
zeroize = "1"
